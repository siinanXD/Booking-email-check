# Quality Gates fuer Booking-email-check
#
# Die verbindliche Definition steht in
# C:\Dev\AI-Workspace\AGENT-SYSTEM\config\quality-gates.yaml,
# die projektspezifischen Befehle in config\projects.yaml.
# Diese Datei ist die projektnahe Kopie zum Nachschlagen.
#
# Ein Gate ohne passendes Werkzeug ist `skipped`, nicht `failed`. Es wird
# kein Werkzeug erzwungen, das dieses Projekt bisher nicht nutzt.

version: 1

always_active:
  - no_secrets
  - no_forbidden_paths
  - no_disabled_tests
  - no_unjustified_dependencies
  - git_diff_check
  - reuse_decision

project_gates:
  tests_pass:
    cmd:
    - python
    - -m
    - pytest
    - -q
    requires: pyproject.toml
    cwd: null
  lint_pass:
    cmd:
    - ruff
    - check
    - .
    requires: pyproject.toml
    cwd: null
  format_pass:
    cmd:
    - ruff
    - format
    - --check
    - .
    requires: pyproject.toml
    cwd: null
  typecheck_pass:
    cmd:
    - python
    - -m
    - mypy
    - .
    requires: pyproject.toml
    cwd: null
  frontend_tests_pass:
    cmd:
    - npm
    - test
    requires: frontend/package.json
    cwd: frontend
  build_pass:
    cmd:
    - npm
    - run
    - build
    requires: frontend/package.json
    cwd: frontend

erkannt_am: 2026-08-03
erkannte_werkzeuge:
  test_runner: ['pytest', 'vitest']
  lint: ['black', 'ruff']
  typecheck: ['mypy', 'tsc']
